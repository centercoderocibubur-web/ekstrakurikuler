<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Guru | CODERO Cibubur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="wrapper">
    <aside class="sidebar hide" id="sidebar">
        <div class="brand">
            <img src="../coderocibubur.jpg" alt="Logo CODERO">
            <h4>CODERO</h4>
            <span>Cibubur</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="../dashboard/"><i class="bi bi-grid-fill"></i>Dashboard</a></li>
            <li><a href="../pilih-sekolah/"><i class="bi bi-people-fill"></i>Data Siswa</a></li>
            <li class="active"><a href="../guru/"><i class="bi bi-person-workspace"></i>Data Guru</a></li>
            <li><a href="../absensi/"><i class="bi bi-calendar-check-fill"></i>Absensi</a></li>
        </ul>
        <button class="logout-btn" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </aside>
    <main class="main full">
        <header class="topbar">
            <div class="left-header">
                <button class="menu-btn" id="menuToggle"><i class="bi bi-list"></i></button>
                <div><h3>Data Guru</h3><small>Kelola guru pengajar ekstrakurikuler</small></div>
            </div>
        </header>
        <section class="content">
            <div class="welcome-box mb-4">
                <h2>Data Guru</h2>
                <p>Tambahkan guru agar dapat dipilih pada setiap pertemuan.</p>
            </div>
            <div class="card-panel">
                <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-3">
                    <h5 class="mb-0">Daftar Guru</h5>
                    <button class="btn btn-primary" id="btnTambahGuru"><i class="bi bi-plus-lg"></i> Tambah Guru</button>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead><tr><th>Nama</th><th>No. Telepon</th><th class="text-end">Aksi</th></tr></thead>
                        <tbody id="tabelGuru"><tr><td colspan="3" class="text-center text-muted">Memuat data guru...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>

<div class="modal fade" id="modalGuru" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="judulModalGuru">Tambah Guru</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <label class="form-label" for="namaGuru">Nama Guru</label>
            <input id="namaGuru" class="form-control mb-3" placeholder="Nama lengkap guru">
            <label class="form-label" for="teleponGuru">No. Telepon <span class="text-muted">(opsional)</span></label>
            <input id="teleponGuru" class="form-control" placeholder="08xxxxxxxxxx">
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary" id="btnSimpanGuru">Simpan</button></div>
    </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/sidebar.js"></script>
<script type="module" src="../js/guru.js"></script>
</body>
</html>
